<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>Video Chat</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/Chalarangelo/mini.css@v3.0.1/dist/mini-default.min.css">
</head>

<body>
    <header class="sticky row">
        <h4>Video Chat</h4>
    </header>
    <div>
        <p>
            <button onclick="startVideoChat()" class="secondary">START VIDEO CHAT</button>
        </p>
        <div class="row">
            <div class="col-sm-6 col-md-6">
                <h4>LOCAL CAMERA</h4>
                <video id="localVideo" autoplay muted playsinline style="width: 100%; background: #000;"></video>
            </div>
            <div class="col-sm-6 col-md-6">
                <h4>REMOTE CAMERA</h4>
                <canvas id="remoteCanvas" style="width: 100%; background: #000;"></canvas>
            </div>
        </div>
        <h4>CONNECTION LOG</h4>
        <textarea style="height:300px;width:100%;" id="logs" disabled></textarea>
    </div>
</body>

</html>

<script src="wasm_exec.js"></script>
<script>
    const go = new Go();
    // WebAssembly.instantiateStreaming(fetch("video-chat.wasm"), go.importObject).then((result) => {
    //     go.run(result.instance);
    // });
    fetch("video-chat.wasm")
      .then(r => r.arrayBuffer())
      .then(bytes => WebAssembly.instantiate(bytes, go.importObject))
      .then(result => {
          go.run(result.instance);
      });

    // ---- DataChannel で送るメディアメッセージ (バイナリ) ----
    // [0] 種別 (1: WebP 画像, 2: JPEG 画像, 3: 16bit PCM 音声)  [1-3] 予約
    // [4-7] タイムスタンプ(ms, 送信開始から)  [8-11] シーケンス番号  [12-15] 音声のサンプリングレート(Hz)
    // [16-] データ本体 (いずれも uint32 リトルエンディアン)
    const HEADER_BYTES = 16;
    const KIND_WEBP = 1, KIND_JPEG = 2, KIND_PCM16 = 3;
    const FRAME_MIME = { [KIND_WEBP]: "image/webp", [KIND_JPEG]: "image/jpeg" };
    const MAX_MESSAGE_BYTES = 200 * 1024; // 1 メッセージの上限(ブラウザ間で安全に送れる大きさ)
    // 送信バッファ(bufferedAmount)がこれを超えている間は送らない(回線が追いつかないとき遅延が伸び続けるのを防ぐ)．
    // 映像は数フレーム分で間引き始め，音声は映像より優先して送る．
    const MAX_BUFFERED_FRAME = 256 * 1024;
    const MAX_BUFFERED_AUDIO = 1024 * 1024;
    const FRAME_INTERVAL = 50; // 映像の送信間隔(ms)．回線・端末が追いつかないときは自動で間引かれる
    const MAX_TEXT_CHARS = 500; // 相手から届く文字列メッセージをログに出す最大文字数

    let dataChannel = null; // RTCDataChannel (Go 側で P2P 接続を確立した後に渡される)
    let sendStartTime = null; // 送信開始タイムスタンプ
    let sendSequence = 0; // 送信シーケンス
    let cameraStarted = false; // カメラ起動済みフラグ

    window.onP2PReady = function (ch) { // P2P 接続完了処理 (Go から呼ばれる)
        dataChannel = ch;
        ch.binaryType = "arraybuffer";
        ch.onmessage = onRemoteMessage; // 受信は JS で直接処理する (Go を経由しない)
        ch.addEventListener("close", () => { dataChannel = null; });
        const start = () => {
            sendStartTime = performance.now(); // 送信開始時刻を記録
            sendSequence = 0; // シーケンス番号をリセット
            appendLog("[Sys]: P2P DataChannel is ready. Start camera."); // ログ追加
            if (!cameraStarted) {
                cameraStarted = true;
                startLocalCamera(); // カメラ起動&データ送信
            }
        };
        if (ch.readyState === "open") {
            start();
        } else {
            ch.addEventListener("open", start, { once: true });
        }
    };

    function startVideoChat() { // ビデオ通信開始
        if (!window.NewVideoChat) { // ビデオ通信開始処理が存在しないとき
            alert("WASM is not initialized yet."); // エラー
            return;
        }
        remoteAudioCtx.resume(); // ブラウザの自動再生制限で停止している音声出力を，クリック操作を契機に再開
        appendLog("[Sys]: Start matchmaking..."); // ログ追加
        window.NewVideoChat(); // ビデオ通話開始(Go)
    }

    const MAX_LOG_CHARS = 20000; // ログの最大文字数(相手からの大量のメッセージでメモリを圧迫しないよう古い方から捨てる)
    function appendLog(msg) { // ログ出力 (textarea の value に追記するため HTML としては解釈されない)
        const logs = document.getElementById("logs"); // ログ要素取得
        let text = logs.value + msg + "\n"; // メッセージ追加
        if (text.length > MAX_LOG_CHARS) {
            text = text.slice(text.length - MAX_LOG_CHARS);
        }
        logs.value = text;
        logs.scrollTop = logs.scrollHeight; // 高さ更新
    }

    function mediaTimestamp(t = performance.now()) { // 送信開始からの経過時間(ms)
        return Math.max(0, Math.floor(t - sendStartTime)) >>> 0;
    }

    function sendMedia(kind, payload, maxBuffered, timestamp, sampleRate = 0) { // メディアメッセージ送信 (送れなかったら false)
        const ch = dataChannel;
        if (!ch || ch.readyState !== "open" || ch.bufferedAmount > maxBuffered) { // 未接続・送信が詰まっているとき
            return false;
        }
        if (HEADER_BYTES + payload.byteLength > MAX_MESSAGE_BYTES) {
            return false;
        }
        const buf = new Uint8Array(HEADER_BYTES + payload.byteLength);
        const view = new DataView(buf.buffer);
        view.setUint8(0, kind);
        view.setUint32(4, timestamp, true);
        view.setUint32(8, (sendSequence++) >>> 0, true);
        view.setUint32(12, sampleRate >>> 0, true);
        buf.set(payload, HEADER_BYTES);
        try {
            ch.send(buf);
            return true;
        } catch (e) { // 切断直後など
            console.error("send error", e);
            return false;
        }
    }

    async function startLocalCamera() { // カメラ+マイク起動&映像フレーム/音声をDataChannel経由で送信
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true,
            }); // メディア起動
            const video = document.getElementById("localVideo"); // ローカルビデオ要素取得
            video.srcObject = stream; // ストリーム指定

            const canvas = document.createElement("canvas"); // キャンバス要素取得
            const ctx = canvas.getContext("2d"); // コンテキスト取得
            const MAX_FRAME_WIDTH = 640; // 送信フレームの最大幅(DataChannelのメッセージサイズ上限対策)
            const probe = document.createElement("canvas"); // WebPエンコード対応確認用
            probe.width = probe.height = 1;
            const useWebP = probe.toDataURL("image/webp").startsWith("data:image/webp"); // 非対応(Safari等)はPNGになり巨大化するためJPEG
            const frameKind = useWebP ? KIND_WEBP : KIND_JPEG;
            let encoding = false; // エンコード中(前のフレームが終わるまで次を作らない)

            setInterval(() => { // 映像フレーム送信
                const ch = dataChannel;
                if (encoding || !ch || ch.readyState !== "open" || ch.bufferedAmount > MAX_BUFFERED_FRAME) { // 送れないときはエンコードも省く
                    return;
                }
                const vw = video.videoWidth; // ビデオサイズ
                const vh = video.videoHeight; // ビデオサイズ
                if (vw === 0 || vh === 0) { // カメラ映像がまだ来ていないとき
                    return;
                }
                const scale = Math.min(1, MAX_FRAME_WIDTH / vw); // 最大幅に収まるよう縮小
                const w = Math.round(vw * scale);
                const h = Math.round(vh * scale);
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w; // ビデオサイズ更新
                    canvas.height = h; // ビデオサイズ更新
                }
                ctx.drawImage(video, 0, 0, w, h); // 現在のフレーム描画
                const timestamp = mediaTimestamp(); // 撮影時点のタイムスタンプ(エンコード後ではなく)
                encoding = true;
                // toBlob は非同期にエンコードするため，toDataURL と違いメインスレッドを止めない
                canvas.toBlob(async (blob) => {
                    try {
                        if (blob) {
                            sendMedia(frameKind, new Uint8Array(await blob.arrayBuffer()), MAX_BUFFERED_FRAME, timestamp);
                        }
                    } finally {
                        encoding = false;
                    }
                }, FRAME_MIME[frameKind], 0.7);
            }, FRAME_INTERVAL);

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // 音声コンテキスト
            const source = audioCtx.createMediaStreamSource(stream); // 音声ソース取得
            const processor = audioCtx.createScriptProcessor(2048, 1, 1); // 1 チャンク約 43ms (大きいほど録音から送信までの遅延が増える)

            processor.onaudioprocess = function (event) { // 音声データが処理される度に発火する処理
                if (!dataChannel) {
                    return;
                }
                const input = event.inputBuffer.getChannelData(0); // ローカルの音声データ(Float32Array [-1,1])
                const timestamp = mediaTimestamp(performance.now() - event.inputBuffer.duration * 1000); // チャンク先頭の録音時点
                const pcm16 = new Int16Array(input.length); // Float32 -> Int16 PCM に変換
                for (let i = 0; i < input.length; i++) { // [-1, 1] -> [-32767, 32767]
                    pcm16[i] = Math.round(Math.max(-1, Math.min(1, input[i])) * 32767);
                }
                sendMedia(KIND_PCM16, new Uint8Array(pcm16.buffer), MAX_BUFFERED_AUDIO, timestamp, audioCtx.sampleRate); // 現在の音声データ送信
            };

            source.connect(processor); // ソースに音声処理を接続
            processor.connect(audioCtx.destination); // ScriptProcessor を動かすために出力へ接続(出力は無音)
            appendLog("[Sys]: Local camera & mic started."); // ログ
        } catch (e) { // エラー時
            console.error(e); // デバッグ用
            alert("Failed to start camera and audio: " + e.message); // エラー
        }
    }

    function onRemoteMessage(event) { // 相手から届いたメッセージ
        const data = event.data;
        if (typeof data === "string") { // 文字列はログに出す(長さ制限あり)
            const text = data.length > MAX_TEXT_CHARS ? data.slice(0, MAX_TEXT_CHARS) + "…" : data;
            appendLog("[Any]: " + text);
            return;
        }
        if (!(data instanceof ArrayBuffer) || data.byteLength < HEADER_BYTES) {
            return;
        }
        const view = new DataView(data);
        const kind = view.getUint8(0);
        const timestamp = view.getUint32(4, true);
        const sequence = view.getUint32(8, true);
        if (kind === KIND_WEBP || kind === KIND_JPEG) { // 画像の種類はこちらで決める(相手が任意の URL や形式を指定できない)
            renderRemoteFrame(new Blob([new Uint8Array(data, HEADER_BYTES)], { type: FRAME_MIME[kind] }), timestamp, sequence);
        } else if (kind === KIND_PCM16 && (data.byteLength - HEADER_BYTES) % 2 === 0) {
            playRemoteAudioChunk(new Int16Array(data, HEADER_BYTES), view.getUint32(12, true), timestamp, sequence);
        }
    }

    // ---- 受信側の再生時計 (映像/音声で共有) ----
    // 送信時刻 timestamp のメディアを performance.now() 基準のいつ再生するかを決める．
    //   再生時刻 = timestamp + offset + JITTER_BUFFER
    // offset は「受信時刻 - 送信時刻」の最小値(最も速く届いたときの伝送遅延と時計の差)．
    // 映像と音声を同じ式で再生するため両者のタイミングがそろい，遅延は JITTER_BUFFER 程度に収まる．
    const JITTER_BUFFER = 200; // 届く間隔の揺らぎを吸収するための待ち(ms)
    const MAX_WAIT = 1000; // 相手から届くタイムスタンプは信用できないため，待ち時間はこの範囲に制限する(ms)
    let playoutOffset = null;
    function playoutTime(timestamp) { // 再生すべき時刻 (performance.now() 基準)
        const now = performance.now();
        const transit = now - timestamp;
        if (playoutOffset === null || transit < playoutOffset) { // より速く届いた → 基準を早める
            playoutOffset = transit;
        } else if (transit - playoutOffset > JITTER_BUFFER) { // 揺らぎ吸収分を超えて遅れて届く(経路が遅くなった) → 少しずつ基準を遅らせる
            playoutOffset += (transit - playoutOffset - JITTER_BUFFER) * 0.05;
        }
        const wait = timestamp + playoutOffset + JITTER_BUFFER - now;
        return now + (Number.isFinite(wait) ? Math.min(Math.max(wait, 0), MAX_WAIT) : 0);
    }

    const renderRemoteFrame = (function () { // 受信したフレーム描画
        const MAX_DECODING = 3; // 同時にデコードするフレーム数の上限(追いつかないときは捨てる)
        const canvas = document.getElementById("remoteCanvas"); // キャンバス要素取得
        const ctx = canvas.getContext("2d"); // コンテキスト取得
        let lastDrawnSequence = -1; // 描画済みの最新シーケンス番号(古いフレームで上書きしない)
        let decoding = 0; // デコード中のフレーム数

        return function (blob, timestamp, sequence) {
            if (decoding >= MAX_DECODING) {
                return;
            }
            const at = playoutTime(timestamp); // 表示すべき時刻
            decoding++;
            // createImageBitmap はメインスレッドを止めずに画像をデコードする
            createImageBitmap(blob).then((bmp) => {
                const draw = () => {
                    if (sequence < lastDrawnSequence) { // 後から来た古いフレームは捨てる
                        bmp.close();
                        return;
                    }
                    lastDrawnSequence = sequence;
                    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { // サイズが変わったときだけ更新(毎回の再確保を避ける)
                        canvas.width = bmp.width; // キャンバスサイズ指定
                        canvas.height = bmp.height; // キャンバスサイズ指定
                    }
                    ctx.drawImage(bmp, 0, 0); // 画像描画
                    bmp.close();
                };
                const wait = at - performance.now();
                if (wait <= 0) { // 表示時刻を過ぎていれば即座に表示
                    draw();
                } else {
                    setTimeout(draw, wait);
                }
            }).catch(() => {
                console.error("renderRemoteFrame: failed to decode frame", sequence);
            }).finally(() => {
                decoding--;
            });
        };
    })();

    const remoteAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); // 受信音声の再生用

    const playRemoteAudioChunk = (function () { // 受信した音声再生
        const audioCtx = remoteAudioCtx;
        const MAX_CHUNK_SAMPLES = 32768; // 1 チャンクの最大サンプル数
        const JOIN_GAP = 0.03; // 前のチャンクの終わりとの差がこれ以内ならつなげて再生する(秒，プツプツ音の防止)
        const MAX_LAG = 0.25; // 予定より遅れて再生しているチャンクがこれを超えたら捨てて追いつく(秒)
        let lastEnd = 0; // 直前に予約したチャンクの再生終了時刻(audioCtx.currentTime 基準)

        return function (pcm16, sampleRate, timestamp, sequence) { // 音声再生(届いた時点で再生時刻を予約する)
            if (pcm16.length === 0 || pcm16.length > MAX_CHUNK_SAMPLES || sampleRate < 8000 || sampleRate > 96000) { // 不正なデータは捨てる
                return;
            }
            const at = playoutTime(timestamp); // 再生すべき時刻 (performance.now() 基準)
            if (audioCtx.state !== "running") { // 自動再生制限などで止まっているとき
                return;
            }
            // performance.now() 基準 → audioCtx.currentTime 基準に変換(スピーカーから出るまでの遅延分だけ早める)
            const now = audioCtx.currentTime;
            const target = now + (at - performance.now()) / 1000 - (audioCtx.outputLatency || audioCtx.baseLatency || 0);
            let start = Math.max(target, now);
            if (Math.abs(start - lastEnd) < JOIN_GAP || start < lastEnd) { // 前のチャンクに続けて再生
                start = Math.max(lastEnd, now);
            }
            if (start - target > MAX_LAG) { // 再生が予定より大きく遅れている → このチャンクを捨てて遅延を解消
                return;
            }
            try {
                // 送信側のサンプリングレートで作る(受信側と異なってもブラウザが変換して再生するため音程がずれない)
                const audioBuffer = audioCtx.createBuffer(1, pcm16.length, sampleRate);
                const channel = audioBuffer.getChannelData(0); // チャンネルデータ取得
                for (let i = 0; i < pcm16.length; i++) { // Int16 -> Float32 に変換
                    channel[i] = pcm16[i] / 32767.0;
                }
                const source = audioCtx.createBufferSource(); // ソース作成
                source.buffer = audioBuffer; // バッファ指定
                source.connect(audioCtx.destination); // 再生先に接続
                source.start(start); // 予約した時刻に再生
                lastEnd = start + audioBuffer.duration;
            } catch (e) { // エラー発生時
                console.error("playRemoteAudioChunk error", e); // デバッグ用
            }
        };
    })();
</script>
